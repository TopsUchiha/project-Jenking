<!DOCTYPE html>
<html>
<head>
    <title>Logo Circular Converter</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        img { max-width: 100%; margin: 20px 0; }
        canvas { border: 1px solid #ddd; margin: 20px 0; }
        button { padding: 10px 20px; background: #d97706; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #c4622d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Make Logo Circular</h1>
        <input type="file" id="logoFile" accept="image/*">
        <canvas id="canvas"></canvas>
        <button onclick="downloadCircular()">Download Circular Logo</button>
    </div>

    <script>
        const fileInput = document.getElementById('logoFile');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Use larger size for better quality
                    const size = 512;
                    canvas.width = size;
                    canvas.height = size;

                    // Draw circular crop
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = 'white';
                    ctx.fill();
                    ctx.clip();

                    // Draw image centered
                    const scale = Math.max(size / img.width, size / img.height);
                    const x = (size - img.width * scale) / 2;
                    const y = (size - img.height * scale) / 2;
                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function downloadCircular() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'logo-circular.png';
            link.click();
        }
    </script>
</body>
</html>
