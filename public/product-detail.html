<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Smokeyz BBQ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
.pd-wrap { display:grid; grid-template-columns:1fr; gap:2.5rem; }
@media (min-width:900px) { .pd-wrap { grid-template-columns:1fr 1fr; } }
.pd-img { aspect-ratio:4/3; background:var(--gray-100); border-radius:var(--radius); overflow:hidden; }
.pd-img img { width:100%; height:100%; object-fit:cover; }
.custom-group { margin-bottom:1.5rem; }
.custom-options { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.5rem; }
.custom-opt {
  padding:0.5rem 1rem; border:1.5px solid var(--gray-200); border-radius:var(--radius);
  background:var(--white); cursor:pointer; font-size:0.875rem; font-weight:500;
}
.custom-opt.selected { border-color:var(--copper); background:var(--cream); color:var(--copper-dark); font-weight:700; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav-logo">Smokeyz<span>BBQ</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/products" class="active">Smokers</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/account">Track Order</a>
    </div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/cart" class="nav-cart" aria-label="View cart">
        🛒 <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </nav>
  <div class="mobile-menu">
    <a href="/">Home</a>
    <a href="/products">Smokers</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/account">Track Order</a>
  </div>
</header>

<main id="main">
<section>
  <div class="container" id="productContainer">
    <p style="text-align:center; color:#4b5563;">Loading product...</p>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; <span id="year"></span> Smokeyz BBQ. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

var selections = {};
var currentProduct = null;

function getProductId() {
  var params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function renderProduct(p) {
  currentProduct = p;
  var container = document.getElementById('productContainer');

  var customHTML = '';
  if (p.customization_options && p.customization_options.length > 0) {
    customHTML = p.customization_options.map(function (group, gi) {
      var opts = (group.options || []).map(function (opt, oi) {
        return '<button type="button" class="custom-opt" data-group="' + gi + '" data-opt="' + esc(opt) + '">' + esc(opt) + '</button>';
      }).join('');
      return '<div class="custom-group"><label style="text-transform:none; font-size:0.9375rem; color:var(--charcoal); font-weight:700;">' + esc(group.name) + '</label>'
        + '<div class="custom-options" data-group-name="' + esc(group.name) + '">' + opts + '</div></div>';
    }).join('');
  }

  var stockHTML = p.inventory === 0
    ? '<p class="stock-note out">Out of stock</p>'
    : p.inventory <= 2
      ? '<p class="stock-note low">Only ' + p.inventory + ' left in stock</p>'
      : '<p class="stock-note">In stock (' + p.inventory + ' available)</p>';

  container.innerHTML =
    '<div class="pd-wrap">'
    + '<div class="pd-img"><img src="' + esc(safeImg(p.image_url)) + '" alt="' + esc(p.name) + '"></div>'
    + '<div>'
    + '<span class="product-type-tag">' + esc(p.type) + '</span>'
    + '<h1 style="font-size:2rem; margin:0.75rem 0 0.5rem;">' + esc(p.name) + '</h1>'
    + '<p class="product-price" style="font-size:1.75rem; margin-bottom:0.75rem;">' + money(p.price) + '</p>'
    + stockHTML
    + '<p style="color:var(--gray-600); margin:1.25rem 0;">' + esc(p.description) + '</p>'
    + '<div id="customOptions">' + customHTML + '</div>'
    + '<div class="form-group" style="max-width:140px;">'
    + '<label for="qtyInput">Quantity</label>'
    + '<input type="number" id="qtyInput" value="1" min="1" max="' + Math.max(p.inventory, 1) + '">'
    + '</div>'
    + '<button id="addToCartBtn" class="btn btn-primary btn-block" ' + (p.inventory === 0 ? 'disabled' : '') + '>'
    + (p.inventory === 0 ? 'Out of Stock' : 'Add to Cart') + '</button>'
    + '<p id="addMsg" style="color:var(--success); font-weight:600; margin-top:0.75rem; display:none;">Added to cart!</p>'
    + '</div></div>';

  // Wire up customization option buttons
  container.querySelectorAll('.custom-opt').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var groupWrap = btn.closest('.custom-options');
      var groupName = groupWrap.getAttribute('data-group-name');
      groupWrap.querySelectorAll('.custom-opt').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      selections[groupName] = btn.getAttribute('data-opt');
    });
  });

  var addBtn = document.getElementById('addToCartBtn');
  if (addBtn) {
    addBtn.addEventListener('click', function () {
      var qty = parseInt(document.getElementById('qtyInput').value, 10) || 1;
      addToCart(currentProduct, qty, Object.keys(selections).length ? selections : null);
      var msg = document.getElementById('addMsg');
      msg.style.display = 'block';
      setTimeout(function () { msg.style.display = 'none'; }, 2500);
    });
  }
}

(async function loadProduct() {
  var id = getProductId();
  var container = document.getElementById('productContainer');
  if (!id) {
    container.innerHTML = '<p style="text-align:center; color:#4b5563;">No product specified. <a href="/products">Browse all smokers</a>.</p>';
    return;
  }
  try {
    var data = await apiGet('/api/products/' + encodeURIComponent(id));
    renderProduct(data.product);
  } catch (e) {
    container.innerHTML = '<p style="text-align:center; color:#4b5563;">Product not found. <a href="/products">Browse all smokers</a>.</p>';
  }
})();
</script>
</body>
</html>
