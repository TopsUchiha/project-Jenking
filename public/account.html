<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order | Smokeyz BBQ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav-logo">Smokeyz<span>BBQ</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/products">Smokers</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/account" class="active">Track Order</a>
    </div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/cart" class="nav-cart" aria-label="View cart">
        🛒 <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </nav>
  <div class="mobile-menu">
    <a href="/">Home</a>
    <a href="/products">Smokers</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/account">Track Order</a>
  </div>
</header>

<main>
<section>
  <div class="container" style="max-width:640px;">
    <h1 style="font-size:2rem; margin-bottom:2rem;">Track Your Order</h1>

    <form id="lookupForm" style="margin-bottom:2.5rem;">
      <div class="form-group">
        <label for="orderIdInput">Order Number</label>
        <input type="text" id="orderIdInput" placeholder="e.g. 1" required>
      </div>
      <button type="submit" class="btn btn-primary">Look Up Order</button>
    </form>

    <div id="resultContainer"></div>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; <span id="year"></span> Smokeyz BBQ. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

var STATUS_ORDER = ['pending_payment', 'processing', 'built', 'shipped', 'delivered'];
var STATUS_LABELS = { pending_payment: 'Order Placed', processing: 'Processing', built: 'Built', shipped: 'Shipped', delivered: 'Delivered' };

function renderOrder(data) {
  var container = document.getElementById('resultContainer');
  var order = data.order;

  if (order.status === 'cancelled') {
    container.innerHTML = '<div class="cart-summary"><p><strong>Order #' + String(order.id).padStart(6, '0') + '</strong></p><p class="mt-lg">This order has been cancelled. Contact us if you have questions.</p></div>';
    return;
  }

  var currentIdx = STATUS_ORDER.indexOf(order.status);
  var timelineHTML = STATUS_ORDER.map(function (s, i) {
    var cls = i < currentIdx ? 'done' : i === currentIdx ? 'current' : '';
    return '<div class="status-step ' + cls + '"><div class="status-dot"></div><span>' + STATUS_LABELS[s] + '</span></div>';
  }).join('');

  var itemsHTML = data.items.map(function (item) {
    return '<div class="summary-row"><span>' + esc(item.product_name) + ' &times;' + item.quantity + '</span><span>' + money(item.price_at_purchase * item.quantity) + '</span></div>';
  }).join('');

  container.innerHTML =
    '<div class="cart-summary">'
    + '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">'
    + '<h3>Order #' + String(order.id).padStart(6, '0') + '</h3>'
    + '<span class="badge badge-' + order.payment_status + '">' + order.payment_status + '</span>'
    + '</div>'
    + '<div class="status-timeline">' + timelineHTML + '</div>'
    + itemsHTML
    + '<div class="summary-row total"><span>Total</span><span>' + money(order.total) + '</span></div>'
    + '</div>';
}

document.getElementById('lookupForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var raw = document.getElementById('orderIdInput').value.trim();
  // Accept "#000001", "000001", or "1" — strip everything but digits, then drop leading zeros.
  var digitsOnly = raw.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  var container = document.getElementById('resultContainer');

  if (!digitsOnly) {
    container.innerHTML = '<p style="color:var(--error);">Please enter a valid order number.</p>';
    return;
  }

  container.innerHTML = '<p style="color:var(--gray-600);">Looking up order...</p>';
  try {
    var data = await apiGet('/api/orders/' + encodeURIComponent(digitsOnly));
    renderOrder(data);
  } catch (err) {
    container.innerHTML = '<p style="color:var(--error);">Order #' + esc(digitsOnly) + ' was not found. Please double-check the number from your confirmation email.</p>';
  }
});

// Auto-lookup if order_id is in URL
(function () {
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('order_id');
  if (orderId) {
    document.getElementById('orderIdInput').value = orderId;
    document.getElementById('lookupForm').dispatchEvent(new Event('submit'));
  }
})();
</script>
</body>
</html>
