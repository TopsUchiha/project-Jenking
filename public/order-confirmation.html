<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | Smokeyz BBQ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav-logo">Smokeyz<span>BBQ</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/products">Smokers</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/account">Track Order</a>
    </div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/cart" class="nav-cart" aria-label="View cart">
        🛒 <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </nav>
  <div class="mobile-menu">
    <a href="/">Home</a>
    <a href="/products">Smokers</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/account">Track Order</a>
  </div>
</header>

<main>
<section>
  <div class="container" style="max-width:640px;">
    <div id="confirmContainer">
      <p style="text-align:center; color:#4b5563;">Loading order details...</p>
    </div>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; <span id="year"></span> Smokeyz BBQ. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

(async function () {
  var params = new URLSearchParams(window.location.search);
  var orderId = params.get('order_id');
  var container = document.getElementById('confirmContainer');

  if (!orderId) {
    container.innerHTML = '<p style="text-align:center;">No order specified. <a href="/">Return home</a>.</p>';
    return;
  }

  try {
    var data = await apiGet('/api/orders/' + encodeURIComponent(orderId));
    container.innerHTML =
      '<div style="text-align:center; margin-bottom:2rem;">'
      + '<div style="font-size:3rem; margin-bottom:1rem;">✓</div>'
      + '<h1 style="font-size:2rem;">Order Confirmed</h1>'
      + '<p style="color:var(--gray-600); margin-top:0.5rem;">Order #' + String(data.order.id).padStart(6, '0') + '</p>'
      + '</div>'
      + '<div class="cart-summary">'
      + '<p style="margin-bottom:0.75rem;">Thank you, ' + esc(data.customer.full_name) + '. We have emailed your confirmation to ' + esc(data.customer.email) + '.</p>'
      + '<p style="color:var(--gray-600); font-size:0.9375rem; margin-bottom:1.25rem;">Our team will review your order and send a secure payment link within 24 hours.</p>'
      + '<div class="summary-row total"><span>Total</span><span>' + money(data.order.total) + '</span></div>'
      + '</div>'
      + '<div class="text-center mt-xl">'
      + '<a href="/account?order_id=' + data.order.id + '" class="btn btn-primary">Track This Order</a>'
      + '<a href="/products" class="btn btn-outline" style="margin-left:0.75rem;">Continue Shopping</a>'
      + '</div>';
  } catch (e) {
    container.innerHTML = '<p style="text-align:center;">Could not find that order. <a href="/">Return home</a>.</p>';
  }
})();
</script>
</body>
</html>
