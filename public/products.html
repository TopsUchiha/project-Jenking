<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Smokers | Smokeyz BBQ</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav-logo">Smokeyz<span>BBQ</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/products" class="active">Smokers</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
      <a href="/account">Track Order</a>
    </div>
    <div style="display:flex; align-items:center; gap:1rem;">
      <a href="/cart" class="nav-cart" aria-label="View cart">
        🛒 <span class="cart-badge" style="display:none;">0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
    </div>
  </nav>
  <div class="mobile-menu">
    <a href="/">Home</a>
    <a href="/products">Smokers</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/account">Track Order</a>
  </div>
</header>

<main id="main">
<section style="padding-bottom:0;">
  <div class="container">
    <div class="section-head" style="margin-bottom:2rem;">
      <h1 style="font-size:2.25rem;">Shop Smokers</h1>
      <p>Filter by type or search for a specific build.</p>
    </div>

    <div style="max-width:420px; margin:0 auto 2rem;">
      <input type="search" id="searchInput" placeholder="Search smokers..." aria-label="Search smokers">
    </div>

    <div class="filter-bar" id="filterBar" style="justify-content:center;">
      <button class="filter-chip active" data-type="">All</button>
      <button class="filter-chip" data-type="Barrel">Barrel</button>
      <button class="filter-chip" data-type="Offset">Offset</button>
      <button class="filter-chip" data-type="Pellet">Pellet</button>
      <button class="filter-chip" data-type="Hybrid">Hybrid</button>
      <button class="filter-chip" data-type="Kettle">Kettle</button>
    </div>
  </div>
</section>

<section style="padding-top:2rem;">
  <div class="container">
    <div class="product-grid" id="productGrid">
      <p style="text-align:center; color:#4b5563; grid-column:1/-1;">Loading smokers...</p>
    </div>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>&copy; <span id="year"></span> Smokeyz BBQ. All rights reserved. &middot; <a href="/privacy-policy" style="color:#9ca3af;">Privacy Policy</a> &middot; <a href="/terms" style="color:#9ca3af;">Terms</a></p>
    </div>
  </div>
</footer>

<script src="/app.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();

var currentType = '';
var currentSearch = '';
var searchTimer = null;

function renderProducts(products) {
  var grid = document.getElementById('productGrid');
  if (products.length === 0) {
    grid.innerHTML = '<p style="text-align:center; color:#4b5563; grid-column:1/-1; padding:2rem 0;">No smokers match your search.</p>';
    return;
  }
  grid.innerHTML = products.map(function (p) {
    var stockNote = p.inventory === 0 ? '<span class="stock-note out">Out of stock</span>'
      : p.inventory <= 2 ? '<span class="stock-note low">Only ' + p.inventory + ' left</span>'
      : '<span class="stock-note">In stock</span>';
    return '<div class="product-card">'
      + '<div class="product-card-img"><img src="' + esc(safeImg(p.image_url)) + '" alt="' + esc(p.name) + '" loading="lazy"></div>'
      + '<div class="product-card-body">'
      + '<span class="product-type-tag">' + esc(p.type) + '</span>'
      + '<h3>' + esc(p.name) + '</h3>'
      + '<p class="product-card-desc">' + esc(p.description.substring(0, 90)) + (p.description.length > 90 ? '...' : '') + '</p>'
      + '<div class="product-price">' + money(p.price) + '</div>'
      + stockNote
      + '<div class="product-card-actions"><a href="/product-detail?id=' + p.id + '" class="btn btn-primary btn-block">View Details</a></div>'
      + '</div></div>';
  }).join('');
}

async function loadProducts() {
  var grid = document.getElementById('productGrid');
  grid.innerHTML = '<p style="text-align:center; color:#4b5563; grid-column:1/-1;">Loading smokers...</p>';
  try {
    var params = new URLSearchParams();
    if (currentType) params.set('type', currentType);
    if (currentSearch) params.set('search', currentSearch);
    var data = await apiGet('/api/products?' + params.toString());
    renderProducts(data.products || []);
  } catch (e) {
    grid.innerHTML = '<p style="text-align:center; color:#4b5563; grid-column:1/-1;">Could not load products right now.</p>';
  }
}

document.getElementById('filterBar').addEventListener('click', function (e) {
  var btn = e.target.closest('.filter-chip');
  if (!btn) return;
  document.querySelectorAll('.filter-chip').forEach(function (c) { c.classList.remove('active'); });
  btn.classList.add('active');
  currentType = btn.getAttribute('data-type') || '';
  loadProducts();
});

document.getElementById('searchInput').addEventListener('input', function (e) {
  clearTimeout(searchTimer);
  var val = e.target.value;
  searchTimer = setTimeout(function () {
    currentSearch = val.trim();
    loadProducts();
  }, 350);
});

loadProducts();
</script>
</body>
</html>
